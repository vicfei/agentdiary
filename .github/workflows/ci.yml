name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm i -g npm@11 --no-audit --no-fund   # runner npm 10.8.2 crashes on node 20.20 ('Exit handler never called')
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
